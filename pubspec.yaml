name: appmobi
description: Cổng thông tin Bệnh nhân H2T Healthcare

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Font
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.1.0

  # UI Helper Tools
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0          # Tạo mã QR Code check-in cho Thẻ bệnh nhân
  intl: ^0.19.0              # Định dạng ngày tháng, tiền tệ
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  flutter_secure_storage: ^8.0.0
  dio: ^5.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true